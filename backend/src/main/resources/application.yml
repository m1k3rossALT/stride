spring:
  application:
    name: stride

  # ── Database ──────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tracker_db}
    username: ${DB_USER:tracker_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      pool-name: TrackerPool

  # ── JPA ───────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate only validates
    open-in-view: false       # Prevents lazy-loading pitfalls in REST context
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Flyway ────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

# ── Server ──────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never    # Never expose raw error messages via Spring's /error
    include-stacktrace: never

# ── Actuator (health endpoint) ───────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ── JWT ──────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:insecure-default-replace-before-running}
  expiry-hours: ${JWT_EXPIRY_HOURS:24}

# ── Logging ──────────────────────────────────────────────────────────────────
# Standard mode: INFO for everything
# Verbose mode : set env vars to DEBUG to enable deep logging
#
# LOG_LEVEL_APP      — com.tracker (your application code)
# LOG_LEVEL_SQL      — Hibernate SQL statements (OFF | DEBUG)
# LOG_LEVEL_SQL_BIND — Hibernate bind parameters (OFF | TRACE)
# LOG_LEVEL_SECURITY — Spring Security filter chain decisions
# LOG_LEVEL_WEB      — Spring MVC dispatcher details
# LOG_LEVEL_FLYWAY   — Flyway migration steps
# LOG_LEVEL_ROOT     — Everything else

logging:
  level:
    root:                                        ${LOG_LEVEL_ROOT:INFO}
    com.tracker:                                 ${LOG_LEVEL_APP:INFO}
    org.springframework.web:                     ${LOG_LEVEL_WEB:INFO}
    org.springframework.security:                ${LOG_LEVEL_SECURITY:INFO}
    org.hibernate.SQL:                           ${LOG_LEVEL_SQL:OFF}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL_BIND:OFF}
    org.flywaydb:                                ${LOG_LEVEL_FLYWAY:INFO}
